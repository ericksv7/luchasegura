      <path class="neck" d="M115 61 108 86"/>
      <path class="torso" d="M108 86 103 132"/>
      
      <path class="limb near" d="M108 86 111 114 113 128 M103 132 98 176 52 178"/>
      <path class="shoe" d="M55 180 47 180"/><path class="shoe" d="M52 178 44 178"/>
      <circle class="head" cx="115" cy="61" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Rodillas apoyadas</text>
  </g>
  <g transform="translate(216 0)">
