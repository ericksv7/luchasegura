      <path class="limb near" d="M105 90 127 100 127 76 M101 128 109 154 113 181"/>
      <path class="shoe" d="M78 181 70 181"/><path class="shoe" d="M113 181 121 181"/>
      <circle class="head" cx="95" cy="64" r="10"/>
      <path class="dumbbell" d="M55 76h18m-16-5v10m14-10v10m47-5h18m-16-5v10m14-10v10"/>
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Carga a los hombros</text>
  </g>
  <g transform="translate(216 0)">
    <rect class="panel" x="3" y="3" width="210" height="204" rx="14"/>
    <path class="ground" d="M19 162H197"/>
    <g transform="translate(27 2) scale(.85)">
      
      <path class="limb far" d="M85 90 69 66 69 37 M89 128 82 154 78 181"/>
