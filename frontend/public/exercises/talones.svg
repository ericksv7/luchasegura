      <path class="shoe" d="M89 181 97 181"/><path class="shoe" d="M99 181 107 181"/>
      <circle class="head" cx="96" cy="60" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Planta en el suelo</text>
  </g>
  <g transform="translate(216 0)">
