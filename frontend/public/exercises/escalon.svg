      <path class="torso" d="M80 84 78 125"/>
      
      <path class="limb near" d="M80 84 64 105 55 121 M78 125 67 154 58 181"/>
      <path class="shoe" d="M124 153 132 153"/><path class="shoe" d="M58 181 66 181"/>
      <circle class="head" cx="77" cy="59" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Apoya todo el pie</text>
  </g>
  <g transform="translate(216 0)">
