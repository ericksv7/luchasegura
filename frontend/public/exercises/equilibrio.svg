<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 210">
  <style>
    .panel{fill:#f0f7f6;stroke:#c1d5d3}
    .ground{stroke:#afc6c6;stroke-width:1.5;stroke-dasharray:3 4}
    .limb,.torso,.shoulders,.neck,.shoe,.band,.support,.weight,.motion{
      fill:none;stroke-linecap:round;stroke-linejoin:round
    }
    .limb{stroke-width:9}
    .far{stroke:#597886}
    .near,.neck,.shoe{stroke:#163542}
    .torso{stroke:#137d72;stroke-width:19}
    .shoulders{stroke:#137d72;stroke-width:12}
    .neck,.shoe{stroke-width:7}
    .head{fill:#163542}
    .band,.weight{stroke:#965018;stroke-width:3.5}
    .support{stroke:#557783;stroke-width:5}
    .machine,.bar,.plates,.cable,.dumbbell,.mat{
      fill:none;stroke-linecap:round;stroke-linejoin:round
    }
    .machine{stroke:#607e87;stroke-width:4}
    .cable{stroke:#607e87;stroke-width:2}
    .bar,.plates,.dumbbell{stroke:#81431a;stroke-width:4}
    .mat{stroke:#8cb8b1;stroke-width:4}
    .platform{fill:#c3d8d6;stroke:#557783;stroke-width:2.5}
    .motion{stroke:#9b4919;stroke-width:2.8;stroke-dasharray:2 4}
    .motion-tip{fill:#9b4919}
    .caption{font:650 13px system-ui,sans-serif;fill:#163542}
    .step{fill:#d6e9e6}
    .step-text{font:700 10px system-ui,sans-serif;fill:#20524c}
  </style>
  <g transform="translate(0 0)">
    <rect class="panel" x="3" y="3" width="210" height="204" rx="14"/>
    <path class="ground" d="M19 162H197"/>
    <g transform="translate(27 2) scale(.85)">
      
      <path class="limb far" d="M80 85 67 109 50 119 M84 123 77 151 73 181"/>
      <path class="neck" d="M90 60 90 85"/>
      <path class="torso" d="M90 85 90 123"/>
      <path class="shoulders" d="M80 85H100"/>
      <path class="limb near" d="M100 85 113 109 130 119 M96 123 104 151 108 181"/>
      <path class="shoe" d="M73 181 65 181"/><path class="shoe" d="M108 181 116 181"/>
      <circle class="head" cx="90" cy="60" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Pies apoyados</text>
  </g>
  <g transform="translate(216 0)">
    <rect class="panel" x="3" y="3" width="210" height="204" rx="14"/>
    <path class="ground" d="M19 162H197"/>
    <g transform="translate(27 2) scale(.85)">
      
      <path class="limb far" d="M76 85 63 109 47 119 M80 123 83 151 81 181"/>
      <path class="neck" d="M86 60 86 85"/>
      <path class="torso" d="M86 85 86 123"/>
      <path class="shoulders" d="M76 85H96"/>
      <path class="limb near" d="M96 85 109 109 126 119 M92 123 115 144 105 164"/>
      <path class="shoe" d="M81 181 73 181"/><path class="shoe" d="M105 164 113 164"/>
      <circle class="head" cx="86" cy="60" r="10"/>
      <path class="motion" d="M137 179 Q134 163 122 149"/><polygon class="motion-tip" points="122,149 129.4,152.1 124.0,156.8"/>
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">2</text>
    <text class="caption" x="44" y="191">Eleva un pie</text>
