      <circle class="head" cx="158" cy="140" r="10"/>
      <path class="motion" d="M166 112 Q173 121 169 139"/><polygon class="motion-tip" points="169,139 167.1,131.2 174.0,132.8"/>
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">2</text>
