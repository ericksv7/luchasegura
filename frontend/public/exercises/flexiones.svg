      <path class="neck" d="M148 98 129 116"/>
      <path class="torso" d="M129 116 84 139"/>
      
      <path class="limb near" d="M129 116 124 146 130 181 M84 139 54 158 28 175"/>
      <path class="shoe" d="M31 172 39 172"/><path class="shoe" d="M28 175 36 175"/>
      <circle class="head" cx="148" cy="98" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Cuerpo alineado</text>
  </g>
  <g transform="translate(216 0)">
