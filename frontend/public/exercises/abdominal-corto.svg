      <path class="limb near" d="M51 175 67 159 78 167 M92 176 131 144 152 181"/>
      <path class="shoe" d="M143 181 151 181"/><path class="shoe" d="M152 181 160 181"/>
      <circle class="head" cx="30" cy="172" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Pies en el suelo</text>
