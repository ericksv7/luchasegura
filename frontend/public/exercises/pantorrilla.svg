      <path class="limb far" d="M106 91 123 113 159 99 M88 128 120 151 129 181"/>
      <path class="neck" d="M110 67 106 91"/>
      <path class="torso" d="M106 91 88 128"/>
      
      <path class="limb near" d="M106 91 126 118 159 107 M88 128 61 154 49 181"/>
      <path class="shoe" d="M129 181 137 181"/><path class="shoe" d="M49 181 57 181"/>
      <circle class="head" cx="110" cy="67" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Un pie atrás</text>
  </g>
  <g transform="translate(216 0)">
    <rect class="panel" x="3" y="3" width="210" height="204" rx="14"/>
    <path class="ground" d="M19 162H197"/>
    <g transform="translate(27 2) scale(.85)">
