      <path class="neck" d="M124 74 115 97"/>
      <path class="torso" d="M115 97 94 132"/>
      
      <path class="limb near" d="M115 97 137 125 159 107 M94 132 68 155 49 181"/>
      <path class="shoe" d="M129 181 137 181"/><path class="shoe" d="M49 181 57 181"/>
      <circle class="head" cx="124" cy="74" r="10"/>
      <path class="motion" d="M83 82 Q96 75 108 83"/><polygon class="motion-tip" points="108,83 100.1,82.0 104.0,76.1"/>
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">2</text>
