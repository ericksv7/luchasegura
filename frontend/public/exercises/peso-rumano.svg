      <path class="shoe" d="M95 181 103 181"/><path class="shoe" d="M83 181 91 181"/>
      <circle class="head" cx="95" cy="59" r="10"/>
      <path class="weight" d="M88 142h22m-20-4v8m16-8v8"/>
    </g>
