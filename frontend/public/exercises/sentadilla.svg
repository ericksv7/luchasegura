      <path class="shoe" d="M103 181 111 181"/><path class="shoe" d="M92 181 100 181"/>
      <circle class="head" cx="103" cy="57" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
