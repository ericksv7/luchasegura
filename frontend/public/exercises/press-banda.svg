      <path class="limb near" d="M105 91 128 103 128 79 M101 127 109 155 114 181"/>
      <path class="shoe" d="M76 181 68 181"/><path class="shoe" d="M114 181 122 181"/>
      <circle class="head" cx="95" cy="65" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Manos a los hombros</text>
  </g>
  <g transform="translate(216 0)">
