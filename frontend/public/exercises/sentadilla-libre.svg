      <path class="shoe" d="M101 181 109 181"/><path class="shoe" d="M88 181 96 181"/>
      <circle class="head" cx="100" cy="53" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
