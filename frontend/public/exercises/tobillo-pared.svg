      <path class="neck" d="M104 63 98 87"/>
      <path class="torso" d="M98 87 76 127"/>
      
      <path class="limb near" d="M98 87 124 106 157 106 M76 127 54 153 43 181"/>
      <path class="shoe" d="M112 178 120 178"/><path class="shoe" d="M43 181 51 181"/>
      <circle class="head" cx="104" cy="63" r="10"/>
      
    </g>
    <rect class="step" x="15" y="178" width="19" height="17" rx="5"/>
    <text class="step-text" x="24.5" y="190" text-anchor="middle">1</text>
    <text class="caption" x="44" y="191">Talón apoyado</text>
  </g>
  <g transform="translate(216 0)">
